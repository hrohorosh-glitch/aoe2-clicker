<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age of Empires II: DE Clicker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Medieval Theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Marcellus&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Marcellus', serif;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            background-color: #0b0907;
        }

        .font-cinzel {
            font-family: 'Cinzel', serif;
        }

        /* AoE2 Background Simulation */
        .aoe-bg {
            background: linear-gradient(rgba(11, 9, 7, 0.8), rgba(11, 9, 7, 0.9)),
                        url('https://images.unsplash.com/photo-1599707367072-cd6ada2bc375?q=80&w=1600&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Gold/Wood Medieval Panel */
        .aoe-panel {
            background: linear-gradient(180deg, #2a1f18 0%, #17100b 100%);
            border: 3px solid #8e6d3b;
            box-shadow: inset 0 0 10px #000, 0 8px 20px rgba(0,0,0,0.8);
            border-radius: 8px;
            position: relative;
        }

        .aoe-panel::before {
            content: '';
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            border: 1px solid #d4af37;
            pointer-events: none;
            border-radius: 5px;
            opacity: 0.5;
        }

        /* Center Click Button */
        .red-click-btn {
            background: radial-gradient(circle, #e62323 0%, #a80f0f 60%, #570000 100%);
            border: 5px solid #f5c842;
            box-shadow: 0 0 30px rgba(230, 35, 35, 0.6), inset 0 4px 10px rgba(255, 255, 255, 0.4), inset 0 -6px 15px rgba(0, 0, 0, 0.7);
            transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.15s ease;
        }

        .red-click-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 40px rgba(255, 50, 50, 0.8), inset 0 4px 12px rgba(255, 255, 255, 0.5);
        }

        .red-click-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(200, 0, 0, 0.9), inset 0 6px 15px rgba(0, 0, 0, 0.9);
        }

        /* Floating Number FX */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            50% { transform: translateY(-40px) scale(1.3); }
            100% { opacity: 0; transform: translateY(-80px) scale(1); }
        }

        .float-text {
            position: absolute;
            pointer-events: none;
            animation: floatUp 0.9s ease-out forwards;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 8px rgba(245, 200, 66, 0.8);
            color: #f5c842;
            z-index: 50;
        }

        /* Golden Header Bar */
        .aoe-header {
            background: linear-gradient(180deg, #423223 0%, #1f160e 100%);
            border-bottom: 3px solid #c8a050;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #140d08; }
        ::-webkit-scrollbar-thumb { background: #6e5027; border-radius: 4px; border: 1px solid #9e783d; }
    </style>
</head>
<body class="aoe-bg text-amber-100 min-h-screen flex flex-col justify-between">

    <header class="aoe-header py-3 px-4 shadow-2xl relative z-20">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <!-- Game Title & Player Level -->
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full border-2 border-amber-400 bg-amber-900 flex items-center justify-center text-amber-300 text-xl shadow-inner font-cinzel font-black">
                    <span id="playerLevelBadge">1</span>
                </div>
                <div>
                    <h1 class="font-cinzel text-lg md:text-xl font-bold tracking-wider text-amber-300 drop-shadow">AGE OF EMPIRES II</h1>
                    <div class="flex items-center gap-2">
                        <span id="currentAgeText" class="text-xs text-amber-400/80 font-semibold uppercase">Темные Века</span>
                        <span id="saveStatusIndicator" class="text-[10px] bg-green-950 text-green-400 border border-green-600/50 px-2 py-0.5 rounded font-bold">
                            <i class="fa-solid fa-floppy-disk mr-1"></i> Сохранено
                        </span>
                    </div>
                </div>
            </div>

            <!-- Resource Indicators -->
            <div class="flex items-center gap-6 md:gap-10 bg-black/50 px-6 py-2 rounded-lg border border-amber-900/60">
                <!-- Taps Count -->
                <div class="flex items-center gap-2" title="Всего тапов">
                    <i class="fa-solid fa-hand-pointer text-amber-500 text-lg"></i>
                    <div>
                        <div class="text-[10px] text-amber-400/70 uppercase font-bold leading-none">Тапов</div>
                        <div id="tapCount" class="font-cinzel text-base md:text-lg font-extrabold text-amber-200">0</div>
                    </div>
                </div>

                <!-- Gold -->
                <div class="flex items-center gap-2" title="Золото">
                    <i class="fa-solid fa-coins text-yellow-400 text-lg"></i>
                    <div>
                        <div class="text-[10px] text-amber-400/70 uppercase font-bold leading-none">Золото</div>
                        <div id="goldCount" class="font-cinzel text-base md:text-lg font-extrabold text-yellow-300">0</div>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center gap-2">
                <button id="soundToggle" onclick="toggleSound()" class="p-2 bg-amber-950/80 hover:bg-amber-900 border border-amber-600/50 rounded text-amber-300 transition" title="Звук">
                    <i id="soundIcon" class="fa-solid fa-volume-high"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl w-full mx-auto p-4 md:p-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">
        
        <!-- LEFT: CLICKER ZONE (7 Cols) -->
        <section class="lg:col-span-7 flex flex-col items-center justify-center text-center py-2">
            
            <!-- Unit Status Badge -->
            <div class="aoe-panel px-6 py-2 mb-4 text-center max-w-sm w-full">
                <div class="text-xs text-amber-400 font-bold uppercase tracking-widest">Текущий Воин</div>
                <div id="unitTitle" class="font-cinzel text-xl md:text-2xl font-black text-yellow-400 tracking-wide drop-shadow">
                    Ополченец
                </div>
                <div class="text-xs text-amber-200/80 mt-1">Сила клика: <span id="clickPowerText" class="text-yellow-300 font-bold">+1</span></div>
            </div>

            <!-- CENTER RED CLICK BUTTON -->
            <div class="relative my-2 flex items-center justify-center">
                <button id="mainClickBtn" onclick="handleClick(event)" class="red-click-btn w-56 h-56 md:w-64 md:h-64 rounded-full flex flex-col items-center justify-center relative cursor-pointer outline-none select-none">
                    <div class="absolute inset-3 rounded-full border border-amber-400/40 pointer-events-none"></div>
                    
                    <div id="unitIconContainer" class="w-24 h-24 md:w-28 md:h-28 mb-1 flex items-center justify-center pointer-events-none">
                        <!-- SVG injected by JS -->
                    </div>

                    <span id="btnUnitLabel" class="font-cinzel font-black text-amber-100 text-base md:text-lg drop-shadow-md tracking-wider pointer-events-none">
                        ОПОЛЧЕНЕЦ
                    </span>
                    <span class="text-[10px] text-amber-200/80 font-bold uppercase mt-0.5 pointer-events-none">Кликни для атаки</span>
                </button>
            </div>

            <!-- Milestone Progress Bar -->
            <div class="w-full max-w-md mt-4 aoe-panel p-3">
                <div class="flex justify-between text-xs font-bold text-amber-300 mb-1">
                    <span id="nextUnitLabel">Прогресс до Мечника</span>
                    <span id="progressText">0 / 50 тапов</span>
                </div>
                <div class="w-full h-4 bg-black/60 rounded-full border border-amber-700/60 p-0.5 overflow-hidden">
                    <div id="progressBar" class="h-full bg-gradient-to-r from-amber-600 to-yellow-400 rounded-full transition-all duration-200" style="width: 0%"></div>
                </div>
            </div>

        </section>

        <!-- RIGHT: FORGE UPGRADES (5 Cols) -->
        <section class="lg:col-span-5 h-full flex flex-col">
            <div class="aoe-panel p-4 flex-1 flex flex-col h-full max-h-[550px]">
                
                <div class="flex items-center justify-between border-b border-amber-800/80 pb-3 mb-3">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-anvil text-amber-400 text-xl"></i>
                        <h2 class="font-cinzel text-lg font-bold text-amber-300 tracking-wide">Кузница (Макс. 20)</h2>
                    </div>
                </div>

                <!-- Upgrades Scrollable List -->
                <div id="upgradesList" class="flex-1 overflow-y-auto space-y-3 pr-1">
                    <!-- Dynamic upgrades inserted by JS -->
                </div>

            </div>
        </section>

    </main>

    <footer class="aoe-panel max-w-6xl w-full mx-auto my-4 p-3 flex flex-wrap items-center justify-between gap-3 text-xs">
        <div class="flex items-center gap-2 text-amber-400 font-bold">
            <i class="fa-solid fa-database"></i> Управление Сохранением:
        </div>

        <div class="flex flex-wrap items-center gap-2">
            <button onclick="manualSave()" class="px-3 py-1.5 bg-amber-900/80 hover:bg-amber-800 border border-amber-600/60 rounded text-amber-200 font-bold transition">
                <i class="fa-solid fa-floppy-disk mr-1"></i> Сохранить
            </button>
            <button onclick="loadGame(true)" class="px-3 py-1.5 bg-amber-950/80 hover:bg-amber-900 border border-amber-700/60 rounded text-amber-300 font-bold transition">
                <i class="fa-solid fa-download mr-1"></i> Загрузить
            </button>
            <button onclick="exportSave()" class="px-3 py-1.5 bg-yellow-950/80 hover:bg-yellow-900 border border-yellow-600/60 rounded text-yellow-300 font-bold transition">
                <i class="fa-solid fa-file-export mr-1"></i> Экспорт
            </button>
            <button onclick="importSave()" class="px-3 py-1.5 bg-blue-950/80 hover:bg-blue-900 border border-blue-600/60 rounded text-blue-300 font-bold transition">
                <i class="fa-solid fa-file-import mr-1"></i> Импорт
            </button>
            <button onclick="resetGame()" class="px-3 py-1.5 bg-red-950/80 hover:bg-red-900 border border-red-600/60 rounded text-red-300 font-bold transition">
                <i class="fa-solid fa-trash-can mr-1"></i> Сброс
            </button>
        </div>
    </footer>

    <script>
        /* ==================== AUDIO SYSTEM ==================== */
        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playClickSound() {
                if (!this.enabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playEvoSound() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(261.63, now);
                osc.frequency.setValueAtTime(329.63, now + 0.1);
                osc.frequency.setValueAtTime(392.00, now + 0.2);
                osc.frequency.setValueAtTime(523.25, now + 0.3);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.6);
            }

            playBuySound() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now);
                osc.frequency.setValueAtTime(880.00, now + 0.08);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.25);
            }
        }

        const soundSystem = new SoundSystem();

        function toggleSound() {
            soundSystem.enabled = !soundSystem.enabled;
            const icon = document.getElementById('soundIcon');
            icon.className = soundSystem.enabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark text-red-400';
        }

        /* ==================== UNITS SVG GRAPHICS ==================== */
        const UNIT_SVGS = {
            militia: `<svg viewBox="0 0 100 100" class="w-full h-full"><circle cx="50" cy="50" r="38" fill="#5c3a21" stroke="#d4af37" stroke-width="4"/><path d="M 50 15 L 50 85 M 15 50 L 85 50" stroke="#3d2513" stroke-width="3"/><circle cx="50" cy="50" r="10" fill="#a80f0f" stroke="#f5c842" stroke-width="2"/><path d="M 30 25 L 70 75 M 70 25 L 30 75" stroke="#f5c842" stroke-width="4" stroke-linecap="round"/></svg>`,
            swordsman: `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M 50 10 L 85 25 V 55 C 85 75 50 90 50 90 C 50 90 15 75 15 55 V 25 Z" fill="#4a5568" stroke="#f5c842" stroke-width="4"/><path d="M 25 25 L 75 75 M 75 25 L 25 75" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="50" r="8" fill="#e62323" stroke="#f5c842" stroke-width="2"/></svg>`,
            archer: `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M 30 15 C 65 30 65 70 30 85" fill="none" stroke="#854d0e" stroke-width="7" stroke-linecap="round"/><line x1="20" y1="50" x2="80" y2="50" stroke="#f5c842" stroke-width="4" stroke-linecap="round"/><polygon points="80,43 93,50 80,57" fill="#dc2626"/></svg>`,
            crossbowman: `<svg viewBox="0 0 100 100" class="w-full h-full"><rect x="45" y="15" width="10" height="70" rx="3" fill="#78350f" stroke="#451a03" stroke-width="2"/><path d="M 15 35 C 45 25 55 25 85 35" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round"/><polygon points="50,12 43,24 57,24" fill="#dc2626"/></svg>`,
            arbalester: `<svg viewBox="0 0 100 100" class="w-full h-full"><circle cx="50" cy="50" r="42" fill="none" stroke="#f5c842" stroke-width="2" stroke-dasharray="4,4"/><rect x="44" y="10" width="12" height="80" rx="4" fill="#334155" stroke="#f5c842" stroke-width="2"/><polygon points="50,5 40,20 60,20" fill="#b91c1c" stroke="#f5c842" stroke-width="1"/></svg>`,
            knight: `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M 30 85 L 35 45 L 60 20 L 75 30 L 65 50 L 80 85 Z" fill="#64748b" stroke="#f5c842" stroke-width="3"/><circle cx="65" cy="30" r="4" fill="#dc2626"/></svg>`,
            cavalier: `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M 25 85 L 30 40 L 60 15 L 80 25 L 70 50 L 85 85 Z" fill="#475569" stroke="#f5c842" stroke-width="4"/><path d="M 40 10 L 65 5 L 55 25 Z" fill="#b91c1c"/></svg>`,
            paladin: `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M 20 85 L 25 35 L 60 10 L 85 20 L 75 50 L 90 85 Z" fill="#d97706" stroke="#f5c842" stroke-width="4"/><path d="M 35 5 L 70 0 L 55 25 Z" fill="#ef4444"/><circle cx="55" cy="45" r="12" fill="#f5c842" stroke="#78350f" stroke-width="2"/></svg>`
        };

        let gameState = {
            taps: 0,
            gold: 0,
            clickMultiplier: 1,
            playerLevel: 1,
            upgrades: {}
        };

        const EVOLUTION_STAGES = [
            { id: 'militia', minTaps: 0, name: 'Ополченец', age: 'Темные Века', basePower: 1, icon: UNIT_SVGS.militia, nextMilestone: 50, nextName: 'Мечник' },
            { id: 'swordsman', minTaps: 50, name: 'Мечник', age: 'Темные Века', basePower: 3, icon: UNIT_SVGS.swordsman, nextMilestone: 200, nextName: 'Лучник' },
            { id: 'archer', minTaps: 200, name: 'Лучник', age: 'Феодальная Эпоха', basePower: 10, icon: UNIT_SVGS.archer, nextMilestone: 500, nextName: 'Самострельщик' },
            { id: 'crossbowman', minTaps: 500, name: 'Самострельщик', age: 'Замковая Эпоха', basePower: 25, icon: UNIT_SVGS.crossbowman, nextMilestone: 750, nextName: 'Арбалетчик' },
            { id: 'arbalester', minTaps: 750, name: 'Арбалетчик', age: 'Замковая Эпоха', basePower: 50, icon: UNIT_SVGS.arbalester, nextMilestone: 1000, nextName: 'Рыцарь' },
            { id: 'knight', minTaps: 1000, name: 'Рыцарь', age: 'Имперская Эпоха', basePower: 120, icon: UNIT_SVGS.knight, nextMilestone: 2000, nextName: 'Кавалер' },
            { id: 'cavalier', minTaps: 2000, name: 'Кавалер', age: 'Имперская Эпоха', basePower: 300, icon: UNIT_SVGS.cavalier, nextMilestone: 5000, nextName: 'Паладин' },
            { id: 'paladin', minTaps: 5000, name: 'Паладин', age: 'Легендарная Эпоха', basePower: 1000, icon: UNIT_SVGS.paladin, nextMilestone: null, nextName: 'MAX' }
        ];

        const UPGRADES_DATA = [
            { id: 'loom', name: 'Ткацкий станок', desc: '+1 к клику за уровень', icon: 'fa-scroll', baseCost: 15, costMult: 1.4, value: 1 },
            { id: 'forging', name: 'Ковка', desc: '+4 к клику за уровень', icon: 'fa-fire-burner', baseCost: 50, costMult: 1.45, value: 4 },
            { id: 'fletching', name: 'Оперение стрел', desc: '+12 к клику за уровень', icon: 'fa-feather', baseCost: 200, costMult: 1.5, value: 12 },
            { id: 'iron_casting', name: 'Отливка железа', desc: '+35 к клику за уровень', icon: 'fa-hammer', baseCost: 800, costMult: 1.55, value: 35 },
            { id: 'bodkin_arrow', name: 'Стрела Бодкин', desc: '+100 к клику за уровень', icon: 'fa-bullseye', baseCost: 2500, costMult: 1.6, value: 100 },
            { id: 'blast_furnace', name: 'Доменная печь', desc: '+300 к клику за уровень', icon: 'fa-volcano', baseCost: 8000, costMult: 1.65, value: 300 }
        ];

        function getCurrentStage() {
            let current = EVOLUTION_STAGES[0];
            for (let i = 0; i < EVOLUTION_STAGES.length; i++) {
                if (gameState.taps >= EVOLUTION_STAGES[i].minTaps) {
                    current = EVOLUTION_STAGES[i];
                }
            }
            return current;
        }

        function calculatePlayerLevel() {
            // Player level from 1 to 20 based on taps
            const lvl = Math.min(20, Math.floor(Math.pow(gameState.taps / 10, 0.4)) + 1);
            gameState.playerLevel = Math.max(1, lvl);
        }

        function getClickPower() {
            const stage = getCurrentStage();
            let bonusPower = 0;

            UPGRADES_DATA.forEach(upg => {
                const lvl = gameState.upgrades[upg.id] || 0;
                bonusPower += upg.value * lvl;
            });

            return (stage.basePower + bonusPower) * gameState.clickMultiplier;
        }

        function handleClick(event) {
            const prevStage = getCurrentStage();
            const clickVal = getClickPower();

            gameState.taps += 1;
            gameState.gold += clickVal;

            calculatePlayerLevel();
            soundSystem.playClickSound();

            const currentStage = getCurrentStage();
            if (currentStage.id !== prevStage.id) {
                soundSystem.playEvoSound();
            }

            createFloatingText(event, `+${clickVal}`);
            updateUI();
            saveGameSilent();
        }

        function buyUpgrade(upgradeId) {
            const upg = UPGRADES_DATA.find(u => u.id === upgradeId);
            if (!upg) return;

            const currentLvl = gameState.upgrades[upgradeId] || 0;
            if (currentLvl >= 20) return; // MAX 20 Limit

            const cost = Math.floor(upg.baseCost * Math.pow(upg.costMult, currentLvl));

            if (gameState.gold >= cost) {
                gameState.gold -= cost;
                gameState.upgrades[upgradeId] = currentLvl + 1;

                soundSystem.playBuySound();
                updateUI();
                saveGameSilent();
            }
        }

        function createFloatingText(event, text) {
            const btn = document.getElementById('mainClickBtn');
            const rect = btn.getBoundingClientRect();
            let x = event && event.clientX ? event.clientX : rect.left + rect.width / 2;
            let y = event && event.clientY ? event.clientY : rect.top + rect.height / 2;

            const el = document.createElement('div');
            el.className = 'float-text text-xl md:text-2xl';
            el.innerText = text;
            el.style.left = `${x + (Math.random() - 0.5) * 30}px`;
            el.style.top = `${y - 20}px`;

            document.body.appendChild(el);
            setTimeout(() => el.remove(), 850);
        }

        const SAVE_KEY = 'aoe2_clicker_save_v3';

        function showSaveIndicator(text, isSaving = false) {
            const ind = document.getElementById('saveStatusIndicator');
            if (isSaving) {
                ind.className = 'text-[10px] bg-yellow-950 text-yellow-400 border border-yellow-600/50 px-2 py-0.5 rounded font-bold';
                ind.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> ${text}`;
            } else {
                ind.className = 'text-[10px] bg-green-950 text-green-400 border border-green-600/50 px-2 py-0.5 rounded font-bold';
                ind.innerHTML = `<i class="fa-solid fa-floppy-disk mr-1"></i> ${text}`;
            }
        }

        function saveGameSilent() {
            try {
                showSaveIndicator('Сохранение...', true);
                localStorage.setItem(SAVE_KEY, JSON.stringify(gameState));
                setTimeout(() => showSaveIndicator('Сохранено'), 400);
            } catch (e) {
                console.error("Save failed:", e);
            }
        }

        function manualSave() {
            saveGameSilent();
            alert("Игра успешно сохранена!");
        }

        function loadGame(notify = false) {
            try {
                const saved = localStorage.getItem(SAVE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    gameState = { ...gameState, ...parsed };
                    calculatePlayerLevel();
                    updateUI();
                    if (notify) alert("Сохранение успешно загружено!");
                } else if (notify) {
                    alert("Сохраненных данных не найдено!");
                }
            } catch (e) {
                console.error("Load failed:", e);
                if (notify) alert("Ошибка при загрузке сохранения!");
            }
        }

        function exportSave() {
            saveGameSilent();
            const dataStr = btoa(JSON.stringify(gameState));
            
            // Clipboard copy
            const dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = dataStr;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);

            alert("Код сохранения скопирован в буфер обмена!");
        }

        function importSave() {
            const code = prompt("Вставьте код сохранения:");
            if (!code) return;

            try {
                const decoded = JSON.parse(atob(code));
                if (decoded && typeof decoded.taps === 'number') {
                    gameState = { ...gameState, ...decoded };
                    saveGameSilent();
                    updateUI();
                    alert("Сохранение успешно импортировано!");
                } else {
                    alert("Неверный код сохранения!");
                }
            } catch (e) {
                alert("Ошибка декодирования кода сохранения!");
            }
        }

        function resetGame() {
            if (confirm("Вы точно хотите сбросить весь прогресс (Тапы, Золото и Уровни)?")) {
                gameState = {
                    taps: 0,
                    gold: 0,
                    clickMultiplier: 1,
                    playerLevel: 1,
                    upgrades: {}
                };
                localStorage.removeItem(SAVE_KEY);
                updateUI();
                alert("Прогресс сброшен.");
            }
        }

        function updateUI() {
            const stage = getCurrentStage();

            document.getElementById('tapCount').innerText = gameState.taps.toLocaleString();
            document.getElementById('goldCount').innerText = Math.floor(gameState.gold).toLocaleString();
            document.getElementById('currentAgeText').innerText = stage.age;
            document.getElementById('playerLevelBadge').innerText = gameState.playerLevel;

            document.getElementById('unitTitle').innerText = stage.name;
            document.getElementById('btnUnitLabel').innerText = stage.name.toUpperCase();
            document.getElementById('clickPowerText').innerText = `+${getClickPower()}`;
            document.getElementById('unitIconContainer').innerHTML = stage.icon;

            // Milestone progress
            const nextLabel = document.getElementById('nextUnitLabel');
            const progressText = document.getElementById('progressText');
            const progressBar = document.getElementById('progressBar');

            if (stage.nextMilestone) {
                const prev = stage.minTaps;
                const prog = gameState.taps - prev;
                const total = stage.nextMilestone - prev;
                const pct = Math.min(100, Math.max(0, (prog / total) * 100));

                nextLabel.innerText = `Прогресс до: ${stage.nextName}`;
                progressText.innerText = `${gameState.taps} / ${stage.nextMilestone} тапов`;
                progressBar.style.width = `${pct}%`;
            } else {
                nextLabel.innerText = 'Достигнут воин максимального уровня!';
                progressText.innerText = `${gameState.taps} тапов`;
                progressBar.style.width = '100%';
            }

            renderUpgrades();
        }

        function renderUpgrades() {
            const container = document.getElementById('upgradesList');
            container.innerHTML = '';

            UPGRADES_DATA.forEach(upg => {
                const level = gameState.upgrades[upg.id] || 0;
                const isMax = level >= 20;
                const cost = isMax ? 0 : Math.floor(upg.baseCost * Math.pow(upg.costMult, level));
                const canAfford = !isMax && gameState.gold >= cost;

                const card = document.createElement('div');
                card.className = `p-3 rounded-lg border flex items-center justify-between gap-3 ${
                    isMax 
                        ? 'bg-amber-900/30 border-yellow-600/40' 
                        : canAfford 
                            ? 'bg-amber-950/60 border-amber-600/60 hover:bg-amber-900/60' 
                            : 'bg-black/40 border-amber-950/40 opacity-70'
                }`;

                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded border border-amber-500/50 bg-amber-950 flex items-center justify-center text-amber-300 text-lg">
                            <i class="fa-solid ${upg.icon}"></i>
                        </div>
                        <div>
                            <div class="font-bold text-amber-200 text-sm flex items-center gap-2">
                                ${upg.name}
                                <span class="text-[11px] px-1.5 py-0.2 ${isMax ? 'bg-yellow-600 text-black font-extrabold' : 'bg-amber-800/80 text-yellow-300'} rounded border border-amber-500/40">
                                    ${isMax ? 'MAX 20' : `Ур. ${level}/20`}
                                </span>
                            </div>
                            <div class="text-xs text-amber-300/70">${upg.desc}</div>
                        </div>
                    </div>
                    <button onclick="buyUpgrade('${upg.id}')" ${!canAfford || isMax ? 'disabled' : ''} 
                        class="px-3 py-1.5 rounded font-cinzel font-bold text-xs flex items-center gap-1.5 transition ${
                            isMax 
                                ? 'bg-gray-700 text-yellow-400 border border-yellow-600/40 cursor-default'
                                : canAfford 
                                    ? 'bg-gradient-to-r from-yellow-600 to-amber-500 hover:from-yellow-500 hover:to-amber-400 text-black shadow-md cursor-pointer' 
                                    : 'bg-gray-800 text-gray-500 cursor-not-allowed border border-gray-700'
                        }">
                        ${isMax ? 'МАКСИМУМ' : `<i class="fa-solid fa-coins"></i> ${cost.toLocaleString()}`}
                    </button>
                `;

                container.appendChild(card);
            });
        }

        // Auto Save Interval every 3 seconds
        setInterval(() => {
            saveGameSilent();
        }, 3000);

        window.onload = function() {
            loadGame();
            updateUI();
        };
    </script>
</body>
</html>
